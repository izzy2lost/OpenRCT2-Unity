name: Build OpenRCT2-Unity UWP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Download json_fwd.hpp
        shell: cmd
        run: |
          curl -L -o src/openrct2/thirdparty/json/json_fwd.hpp https://raw.githubusercontent.com/nlohmann/json/develop/single_include/nlohmann/json_fwd.hpp
    
      - name: Build openrct2-bindings
        shell: cmd
        run: |
          "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" src/openrct2-bindings/openrct2-bindings.vcxproj /p:Configuration=Release /p:Platform=x64
    
      - name: Build OpenRCT2-Unity for UWP
        id: build
        uses: buildalon/unity-uwp-builder@v1.0.4
        with:
          projectPath: 'src/openrct2-unity'
          buildTarget: 'UWP'
          outputPath: 'BuildOutput'

      - name: Upload UWP Build as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRCT2-UWP
          path: ${{ steps.build.outputs.executable }}
