name: Build OpenRCT2-Unity (UWP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 🛠 Install UWP Tools with Visual Studio Installer
    - name: Install UWP Build Tools
      run: |
        # Use the Visual Studio Installer to add UWP workload
        "C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vs_installer.exe" install --add Microsoft.VisualStudio.Workload.UniversalBuildTools --quiet --wait
        
    # 🛠 Setup MSBuild (Already Installed)
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1

    # 🎮 Switch Unity Project to UWP & Export Solution
    - name: Build Unity Project for UWP
      run: |
        Unity.exe -batchmode -quit -nographics -logFile unity.log -projectPath . -executeMethod UnityEditor.BuildPipeline.BuildPlayer -buildTarget WSAPlayer -customBuildPath Build/UWP -customBuildTarget WSAPlayer -customBuildName OpenRCT2-Unity-UWP

    # 🛠 Build UWP Solution using MSBuild
    - name: Build UWP Solution
      run: |
        msbuild Build/UWP/OpenRCT2-Unity.sln /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Always /p:UapAppxPackageBuildMode=StoreUpload

    # 📤 Upload Build Artifacts
    - name: Upload UWP Build
      uses: actions/upload-artifact@v4
      with:
        name: UWP-Build
        path: Build/UWP/AppPackages

    - name: Upload Unity Package
      uses: actions/upload-artifact@v4
      with:
        name: Unity-Package
        path: Build/OpenRCT2-Unity.unitypackage
